<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма замовлення авто</title>
</head>
<body>
    <a href="index.html">Головна</a> 
    <h2>Форма замовлення автомобіля</h2>
    <form>

        <!-- personal info -->
        <fieldset>
            <legend>Персональна інформація</legend>

            <div>
                <label for="last-name">Прізвище </label>
                <input type="text" id="last-name" required>
            </div>

            <div>
                <label for="first-name">Ім'я </label>
                <input type="text" id="first-name" required>
            </div>

            <div>
                <label for="birthday">Дата народження </label>
                <input type="date" id="birthday" required>
            </div>

            <div>
                <p>Стать</p>
                <label for="male">Чоловік</label>
                <input type="radio" name="gender" id="male" checked>

                <label for="female">Жінка</label>
                <input type="radio" name="gender" id="female">
            </div>

            <div>
                <label for="drive-experience">Досвід водіння </label>
                <select id="drive-experience" required>
                    <option value="">---</option>
                    <option value="1 year">1 year</option>
                    <option value="2 years">2 years</option>
                    <option value="3+ years">3+ years</option>
                </select>
            </div>

        </fieldset>

        <!-- contacts -->
        <fieldset>
            <legend>Контактні дані</legend>

            <div>
                <label for="email">Email </label>
                <input type="email" id="email" required>
            </div>

            <div>
                <label for="phone">Phone </label>
                <input type="tel" id="phone" required>
            </div>

            <div>
                <label for="adress">Adress </label>
                <textarea id="adress" rows="4" cols="30" required></textarea>
            </div>

        </fieldset>

        <!-- car info -->
        <fieldset>
            <legend>Інформація про машину</legend>

            <div>
                <label for="brand">Бренд</label>
                <select id="brand" required>
                    <option value="">---</option>
                    <option value="BMW">BMW</option>
                    <option value="Audi">Audi</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Volkswagen">Volkswagen</option>
                </select>
            </div>

            <div>
                <label for="model">Модель</label>
                <select id="model" required>
                    <option value="">---</option>
                    <option value="Model 1">Model 1</option>
                    <option value="Model 2">Model 2</option>
                </select>
            </div>

            <div>
                <label for="used">Вживана</label>
                <input type="checkbox" id="used">
            </div>

            <div>
                <p>Колір</p>

                <label for="red">Червоний</label>
                <input type="radio" name="color" id="red">

                <label for="black">Чорний</label>
                <input type="radio" name="color" id="black">

                <label for="blue">Синій</label>
                <input type="radio" name="color" id="blue">

                <label for="white">Білий</label>
                <input type="radio" name="color" id="white">

                <label for="grey">Сірий</label>
                <input type="radio" name="color" id="grey" checked>
            </div>

            <div>
                <label for="price">Ціна</label>
                <input type="range" id="price" min="5000" max="100000">
            </div>

        </fieldset>

        <!-- buttons -->
        <div>
            <input type="reset" value="Скинути">
            <input type="submit" value="Відправити">
        </div>

    </form>

</body>
</html>
