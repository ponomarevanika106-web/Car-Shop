<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Flexbox Homework</title>
  <link rel="stylesheet" href="/assets/order.css" />
</head>

<body>
<header>
  <nav>
    <ul class="nav-list">
      <li><a href="index.html" class="nav-link">Home</a></li>
    </ul>
  </nav>
</header>

<main>
<form>
<h1>Home work for CSS flexbox</h1>
<section class="container">

  <!-- Personal Info -->
  <fieldset class="personal-info">
    <legend>Personal info</legend>

    <div class="field">
      <label for="first-name">First Name</label>
      <input type="text" id="first-name" required />
    </div>

    <div class="field">
      <label for="last-name">Last Name</label>
      <input type="text" id="last-name" required />
    </div>

    <div class="field">
      <label for="birthday">Birthday</label>
      <input type="date" id="birthday" required />
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="inline">
        <label><input type="radio" name="radio" checked /> Male</label>
        <label><input type="radio" name="radio" /> Female</label>
      </div>
    </div>

    <div class="field">
      <label for="drive-experience">Drive experience</label>
      <select id="drive-experience" required>
        <option value="">---</option>
        <option>expent</option>
        <option>more than 10</option>
        <option>5-10</option>
        <option>2-5</option>
        <option>less than 2</option>
        <option>beginner</option>
      </select>
    </div>
  </fieldset>

  <!-- Contacts -->
  <fieldset class="contact-data">
    <legend>Contacts</legend>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" required />
    </div>

    <div class="field">
  <label for="address">Address</label> <textarea id="address" required></textarea>
</div>

  </fieldset>

  <!-- Car info -->
  <fieldset>
    <legend>Car info</legend>

    <div class="field">
      <label for="brand">Brand</label>
      <select id="brand" required>
        <option value="">---</option>
        <option>Ford</option>
        <option>Volkswagen</option>
        <option>BMW</option>
      </select>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <select id="model" required>
        <option value="">---</option> 
        <option>Ford Model T</option>
        <option>Ford Mustang</option>
        <option>Volkswagen Beetle  </option>
        <option>Volkswagen Golf  </option>
        <option>BMW 3 Series </option>
        <option>BMW X5</option>
      </select>
    </div>

<div class="field">
  <label for="used">Used</label>
  <input type="checkbox" id="used">
</div>

<div class="field colors">
  <label><input type="radio" name="color" /> Red</label>
  <label><input type="radio" name="color" /> Black</label>
  <label><input type="radio" name="color" /> Blue</label>
  <label><input type="radio" name="color" /> White</label>
  <label><input type="radio" name="color" checked /> Grey</label>
</div>

<div class="field price-container">
  <label for="price">Price</label>
  <div class="range-wrapper">
    <input type="range" id="price" min="10" max="80" step="10" list="tickmarks">
    <datalist id="tickmarks">
      <option value="10" label="10"></option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="40">40</option>
      <option value="50">50</option>
      <option value="60">60</option>
      <option value="70">70</option>
      <option value="80">80</option>
    </datalist>
  </div>
</div>


  </fieldset>

</section>

<!-- Buttons -->
<section class="buttons">
  <input type="reset" value="Cancel" />
  <input type="submit" value="OK" />
</section>

</form>
</main>

</body>
</html>
